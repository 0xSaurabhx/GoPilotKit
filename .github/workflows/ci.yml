name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23', '1.24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race -count=1 ./...

      - name: Build
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o bin/gopilotkit ./cmd/engine/

      - name: Check binary size
        run: ls -lh bin/gopilotkit

  validate-config:
    name: Validate Configs
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o bin/gopilotkit ./cmd/engine/

      - name: Validate personal config
        run: OPENAI_API_KEY=test ./bin/gopilotkit validate --config configs/personal.yaml

      - name: Validate team config
        run: OPENAI_API_KEY=test ANTHROPIC_API_KEY=test ./bin/gopilotkit validate --config configs/team.yaml

      - name: Validate enterprise config
        run: OPENAI_API_KEY=test ANTHROPIC_API_KEY=test OIDC_ISSUER=https://test.com DATABASE_URL=postgres://localhost/test ./bin/gopilotkit validate --config configs/enterprise.yaml
